name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ---------------------------------------------------------------------------
  # Backend NestJS: lint, testes unitários e e2e contra um Postgres real.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dashstudy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d dashstudy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/dashstudy_test?schema=public
      JWT_SECRET: segredo-de-ci-com-mais-de-32-caracteres-ok
      FRONTEND_URL: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:3000

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Gerar Prisma Client
        run: npm run prisma:generate

      - name: Aplicar migrations
        run: npm run prisma:deploy

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Testes unitários
        run: npm test

      - name: Testes e2e
        run: npm run test:e2e

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Frontend Next.js: sem banco, consome a API do backend em runtime.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (lint, type-check, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BACKEND_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Valida que as imagens de produção constroem em todo PR/push.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Build das imagens Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]

    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            image: dashstudy-backend
          - name: frontend
            context: .
            image: dashstudy-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ---------------------------------------------------------------------------
  # Publica as imagens no GHCR só quando main já passou por tudo.
  # ---------------------------------------------------------------------------
  publish:
    name: Publicar imagens (main)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: .

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ---------------------------------------------------------------------------
  # Gate de promoção: PRs para main só mergeiam com todo o resto verde.
  # ---------------------------------------------------------------------------
  preview-gate:
    name: Preview Gate (PR para main)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: [backend, frontend, docker-build]

    steps:
      - run: echo "Todas as verificações passaram — PR liberado para merge."
